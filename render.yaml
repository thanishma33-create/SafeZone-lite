services:
  - type: web
    name: safezone-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: FAST2SMS_API_KEY
        sync: false
      - key: PERSONAL_CONTACT
        sync: false
